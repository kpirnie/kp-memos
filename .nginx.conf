# ---------------------------------------------------------------------------
# KP Memos - per-site nginx rules
#
# included at the bottom of the site's server block. `^~` prefix locations
# win over every regex location in the server block (including the
# `\.php$` handler), so nothing below these paths can ever be served or
# executed directly. `=` exact locations win over everything. with these
# in place, the root index.php is the only php file that can execute.
# ---------------------------------------------------------------------------

# application source, views, and configuration
location ^~ /app/ { deny all; return 404; }

# cli scripts
location ^~ /bin/ { deny all; return 404; }

# database schema, procedures, and grants
location ^~ /database/ { deny all; return 404; }

# uploaded attachments and runtime data, only ever served through the app
location ^~ /storage/ { deny all; return 404; }

# router runtime data
location ^~ /tmp/ { deny all; return 404; }

# composer dependencies
location ^~ /vendor/ { deny all; return 404; }

# editor and syntax highlighter assets, static files only; longer prefixes win over /vendor/
location ^~ /vendor/hugerte/hugerte/ { try_files $uri =404; }
location ^~ /vendor/prismjs/prism/ { try_files $uri =404; }

# project metadata files
location = /composer.json { deny all; return 404; }
location = /composer.lock { deny all; return 404; }
location = /readme.md { deny all; return 404; }
location = /phpcs.xml { deny all; return 404; }

# the service worker must never be cached long-term, or updates never land
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
}

# web app manifest
location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
